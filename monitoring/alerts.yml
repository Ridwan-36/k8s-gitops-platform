groups:
  - name: kubernetes-alerts
    rules:
      - alert: PodRestartingFrequently
        expr: increase(kube_pod_container_status_restarts_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 5 minutes."

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          description: "Node Exporter target is unavailable."
